<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Будешь моей Валентиной?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      font-family: "Arial Black", Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2vw;
      overflow: hidden;
      touch-action: manipulation; /* улучшает тач на мобильных */
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem); /* адаптивный размер */
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.7);
      margin-bottom: 8vh;
      line-height: 1.1;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 5vh;
      width: 100%;
      max-width: 400px;
    }

    button {
      font-family: "Arial Black", Arial, sans-serif;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      padding: 1.2rem 2rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 100%;
      touch-action: manipulation;
    }

    #yes {
      background: #ff4757;
      color: white;
    }

    #yes:hover, #yes:active {
      transform: scale(1.1);
      box-shadow: 0 12px 30px rgba(255, 71, 87, 0.5);
      background: #ff6b81;
    }

    #no {
      background: #57606f;
      color: white;
    }

    #no:hover, #no:active {
      transform: scale(0.7);          /* уменьшается при наведении/нажатии */
      opacity: 0.6;
      box-shadow: none;
      background: #747d8c;
    }

    @media (min-width: 768px) {
      .buttons {
        flex-direction: row;
        gap: 8vw;
      }
      button {
        width: auto;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <h1>Будешь моей<br>Валентиной? 💕</h1>

  <div class="buttons">
    <button id="yes">Дааа 😍</button>
    <button id="no">Нет 😔</button>
  </div>

  <script>
    const yesBtn = document.getElementById('yes');

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <div style="text-align:center; padding: 5vw;">
          <h1 style="font-size: clamp(3rem, 10vw, 6rem);">УРААА! 💖💖💖</h1>
          <p style="font-size: clamp(1.8rem, 6vw, 3rem); margin-top: 4vh;">
            Мы теперь парочка! 🥰<br>Я ❤️ тебя
          </p>
        </div>
      `;
    });
  </script>
</body>
</html>
