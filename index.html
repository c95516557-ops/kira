<!DOCTYPE html>
<html lang="ru">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Будешь моей Валентиной?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }
    h1 {
      font-size: 4rem;
      text-shadow: 0 0 20px rgba(255,105,180,0.8);
      margin-bottom: 2rem;
    }
    .buttons {
      display: flex;
      gap: 4rem;
    }
    button {
      padding: 1rem 3rem;
      font-size: 2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }
    #yes {
      background: #ff4757;
      color: white;
    }
    #yes:hover { transform: scale(1.15); box-shadow: 0 0 30px #ff4757; }
    #no {
      background: #57606f;
      color: white;
      position: relative;
    }
  </style>
</head>
<body>
  <h1>Будем вместе на 14 февраля? 💕</h1>
  
  <div class="buttons">
    <button id="yes">Даааа </button>
    <button id="no">Нет 😔</button>
  </div>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.position = 'absolute';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <h1 style="font-size:5rem;">УРААА! 💖💖💖<br> 🥰</h1>
        <p style="font-size:2rem;">Я ❤️ тебя</p>
      `;
      // Можно добавить конфетти или музыку
    });
  </script>
</body>
</html>
